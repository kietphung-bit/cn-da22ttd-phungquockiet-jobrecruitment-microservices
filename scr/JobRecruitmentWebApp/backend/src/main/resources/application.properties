# ============================================
# Câu hình ứng dụng chung
# ============================================
# Tệp này đặt các giá trị mặc định toàn cục và lựa chọn profile
# Thông tin đăng nhập thực tế nằm trong các tệp cấu hình theo profile

# ============================================
# PROFILE ĐANG KÍCH HOẠT
# ============================================
# Lựa chọn: dev (phát triển cục bộ), prod (docker/vps)
spring.application.name=JobRecruitment Backend
spring.profiles.active=dev

# ============================================
# TẢI LÊN TỆP
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# CẤU HÌNH JACKSON JSON
# ============================================
# Định dạng ngày/giờ
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh
# Xử lý giá trị null
spring.jackson.default-property-inclusion=NON_NULL

# ============================================
# TỐI ƯU HIỆU SUẤT JPA
# ============================================
# Vô hiệu hóa open-in-view để ngăn chặn các vấn đề lazy loading
spring.jpa.open-in-view=false

# ============================================
# CẤU HÌNH SERVER XỬ LÝ YÊU CẦU
# ============================================
server.port=8080
# Lưu ý: Chi tiết lỗi được kiểm soát bởi các trình xử lý ngoại lệ trong GlobalExceptionHandler

# ============================================
# SWAGGER/OPENAPI UI
# ============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha